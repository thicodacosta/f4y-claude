<!doctype html>
<html>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background-color:#0f1f3d;padding:24px 32px;">
                <span style="color:#ffffff;font-size:18px;letter-spacing:0.05em;">FIND4YOU</span>
                <div style="color:#c9a86a;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;margin-top:2px;">Business Platform</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;color:#1f2937;font-size:15px;line-height:1.6;">
                <p style="margin-top:0;">Olá,</p>
                <p>Use o botão abaixo para acessar seu portal Find4You com segurança, sem senha.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                  <tr>
                    <td style="background-color:#0f1f3d;border-radius:6px;">
                      <a
                        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/dashboard"
                        style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-size:14px;letter-spacing:0.02em;"
                      >
                        Entrar no portal
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="color:#6b7280;font-size:13px;">
                  Se você não solicitou este acesso, pode ignorar este e-mail com segurança.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
