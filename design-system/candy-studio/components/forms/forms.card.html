<html><head><link rel="stylesheet" href="../../styles.css"><script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script></head><body style="margin:0"><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, Textarea, FormField } = window.CandyStudioDesignSystem_c687d1;
function Demo(){
  const [c,setC]=React.useState(true); const [r,setR]=React.useState('monthly'); const [s,setS]=React.useState(true);
  return <div style={{padding:24,display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,fontFamily:'Inter,sans-serif'}}>
    <FormField label="E-mail profissional" required><Input placeholder="voce@empresa.com"/></FormField>
    <FormField label="País"><Select><option>Estados Unidos</option><option>Brasil</option></Select></FormField>
    <FormField label="Detalhes do projeto"><Textarea placeholder="Conte sobre seu projeto..."/></FormField>
    <div style={{display:'flex',flexDirection:'column',gap:14,justifyContent:'center'}}>
      <Checkbox label="Quero receber novidades" checked={c} onChange={()=>setC(!c)}/>
      <div style={{display:'flex',gap:16}}>
        <Radio label="Mensal" checked={r==='monthly'} onChange={()=>setR('monthly')}/>
        <Radio label="Anual" checked={r==='yearly'} onChange={()=>setR('yearly')}/>
      </div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}><Switch checked={s} onChange={setS}/><span style={{fontSize:14,color:'var(--text-muted)'}}>Notificações</span></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
