<html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:16px;background:var(--bg)">
<div style="display:flex;gap:12px;font-family:Inter,sans-serif">
<div style="flex:1;background:var(--color-success-subtle);border-radius:12px;padding:14px;border:1px solid var(--border)"><div style="width:24px;height:24px;border-radius:8px;background:var(--color-success);margin-bottom:8px"></div><div style="font-size:13px;font-weight:600;color:var(--color-success-strong)">Success</div></div><div style="flex:1;background:var(--color-warning-subtle);border-radius:12px;padding:14px;border:1px solid var(--border)"><div style="width:24px;height:24px;border-radius:8px;background:var(--color-warning);margin-bottom:8px"></div><div style="font-size:13px;font-weight:600;color:var(--color-warning-strong)">Warning</div></div><div style="flex:1;background:var(--color-error-subtle);border-radius:12px;padding:14px;border:1px solid var(--border)"><div style="width:24px;height:24px;border-radius:8px;background:var(--color-error);margin-bottom:8px"></div><div style="font-size:13px;font-weight:600;color:var(--color-error-strong)">Error</div></div>
