<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#F6F8FA;font-family:Inter,Arial,sans-serif;color:#0B1F3A">

      <tr><td align="center">

            <p style="margin:0;font-size:13px;line-height:1.6;color:#526173">Se você não reconhece este pedido, ignore esta mensagem.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
