<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Pesquisa · Candydate</title>
    <meta name="description" content="Pesquisa confidencial de experiência do colaborador." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@500;600;700&display=swap" />
    <style>
      /* Tokens do design system Candy Studio (design-system/candy-studio). */
      :root {
        --primary: #4f46e5;
        --ink: #18181b;
        --muted: #71717a;
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --border-strong: #d4d4d8;
        --primary-ink: #4f46e5;
        --cta: #4f46e5;
        --cta-hover: #4338ca;
        --on-cta: #ffffff;
        --ring: rgba(79, 70, 229, 0.18);
        --danger: #dc2626;
        --soft: #eef2ff;
        --header-bg: rgba(255, 255, 255, 0.85);
        --mesh: radial-gradient(at 20% 0%, #e0e7ff 0, transparent 50%), radial-gradient(at 80% 20%, #ede9fe 0, transparent 50%);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #fafafa;
          --muted: #a1a1aa;
          --bg: #09090b;
          --surface: #18181b;
          --border: #27272a;
          --border-strong: #3f3f46;
          --primary-ink: #a5b4fc;
          --ring: rgba(129, 140, 248, 0.28);
          --danger: #f87171;
          --soft: rgba(99, 102, 241, 0.16);
          --header-bg: rgba(9, 9, 11, 0.85);
          --mesh: radial-gradient(at 20% 0%, rgba(79, 70, 229, 0.18) 0, transparent 50%), radial-gradient(at 80% 20%, rgba(124, 58, 237, 0.14) 0, transparent 50%);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--mesh), var(--bg);
        background-repeat: no-repeat;
        background-size: 100% 520px, auto;
        color: var(--ink);
        font: 400 15px/24px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header.topo {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--header-bg);
        -webkit-backdrop-filter: saturate(180%) blur(12px);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--border);
        color: var(--ink);
        padding: 12px 16px;
      }
      header.topo .marca {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font: 600 15px/20px Geist, Inter, sans-serif; letter-spacing: -0.02em;
      }
      header.topo img { height: 24px; width: auto; }
      .progresso { position: sticky; top: 49px; z-index: 2; height: 4px; background: var(--border); }
      .progresso span { display: block; height: 100%; width: 0; background: var(--primary); transition: width 360ms cubic-bezier(0.16, 1, 0.3, 1); }
      main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
      .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-ink); }
      h1 { margin: 0 0 10px; font: 600 30px/36px Geist, Inter, sans-serif; letter-spacing: -0.02em; }
      .lead { margin: 0 0 20px; color: var(--muted); white-space: pre-line; }
      .aviso { padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 13.5px; margin-bottom: 20px; }
      fieldset { margin: 0 0 14px; padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px rgba(24, 24, 27, 0.04); }
      fieldset.erro { border-color: var(--danger); }
      legend { float: left; width: 100%; padding: 0; margin: 0 0 12px; font-weight: 600; }
      legend .num { color: var(--primary-ink); margin-right: 6px; }
      legend .opc { font-weight: 400; color: var(--muted); font-size: 13px; }
      .escala { display: grid; gap: 6px; clear: both; }
      .escala--5 { grid-template-columns: repeat(5, 1fr); }
      .escala--11 { grid-template-columns: repeat(11, 1fr); }
      .escala label, .opcoes label { position: relative; cursor: pointer; }
      .escala input, .opcoes input { position: absolute; opacity: 0; }
      .escala span {
        display: grid; place-items: center; min-height: 42px; padding: 4px 2px;
        border: 1px solid var(--border-strong); border-radius: 10px; font-weight: 600; text-align: center;
      }
      .escala input:checked + span, .opcoes input:checked + span { background: var(--cta); border-color: var(--cta); color: var(--on-cta); }
      .escala input:focus-visible + span, .opcoes input:focus-visible + span { outline: none; box-shadow: 0 0 0 4px var(--ring); }
      .pontas { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); clear: both; }
      .opcoes { display: grid; gap: 6px; clear: both; }
      .opcoes span { display: block; padding: 10px 12px 10px 38px; border: 1px solid var(--border-strong); border-radius: 10px; position: relative; }
      .opcoes span::before { content: ""; position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border: 2px solid var(--border-strong); border-radius: 50%; background: var(--surface); }
      .opcoes input[type="checkbox"] + span::before { border-radius: 4px; }
      .opcoes input:checked + span::before { border-color: var(--on-cta); background: var(--on-cta); box-shadow: inset 0 0 0 3px var(--cta); }
      textarea, input[type="text"], input[type="email"] {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 12px;
        background: var(--surface); color: var(--ink); font: inherit; clear: both; display: block;
      }
      textarea { min-height: 96px; resize: vertical; }
      textarea:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
      label.campo { display: block; font-weight: 600; margin: 0 0 6px; }
      .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; clear: both; }
      .msg-erro { color: var(--danger); font-size: 13px; margin: 8px 0 0; clear: both; }
      button.enviar {
        width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--cta); color: var(--on-cta);
        font: 600 16px/20px Inter, sans-serif; cursor: pointer; transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1), transform 120ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      button.enviar:disabled { opacity: 0.6; cursor: wait; }
      button.enviar:hover { background: var(--cta-hover); transform: translateY(-1px); }
      button.enviar:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
      .estado { text-align: center; padding: 60px 0; }
      .estado h1 { font-size: 26px; }
      .rodape { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @media (max-width: 520px) {
        .escala--11 { grid-template-columns: repeat(6, 1fr); }
        h1 { font-size: 24px; line-height: 30px; }
      }
    </style>
  </head>
  <body>
    <header class="topo"><div class="marca"><span id="empresa">Pesquisa</span><img src="candydate-logo.png" alt="Candydate" /></div></header>
    <div class="progresso" aria-hidden="true"><span id="barra"></span></div>
    <main id="conteudo" aria-live="polite">
      <div class="estado"><p>Carregando a pesquisa…</p></div>
    </main>
    <script>
      // Configuração embutida pelo build (build.mjs). A chave é a publicável:
      // só permite chamar as duas funções públicas da pesquisa.
      const SUPABASE_URL = "__SUPABASE_URL__";
      const SUPABASE_KEY = "__SUPABASE_PUBLISHABLE_KEY__";
      const LIKERT = ["Discordo totalmente", "Discordo", "Neutro", "Concordo", "Concordo totalmente"];
      const ERROS = {
        link_invalido: "Este link não é válido. Confira se ele foi copiado por inteiro.",
        pesquisa_encerrada: "Esta pesquisa foi encerrada e não recebe mais respostas.",
        ja_respondida: "Esta entrevista já foi respondida. Obrigado!",
        respostas_invalidas: "Não foi possível registrar as respostas. Recarregue a página e tente de novo.",
      };

      const $ = (id) => document.getElementById(id);
      function el(tag, attrs, ...filhos) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (v == null || v === false) continue;
          if (k === "class") n.className = v;
          else if (k === "text") n.textContent = v;
          else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
          else n.setAttribute(k, v === true ? "" : v);
        }
        for (const f of filhos.flat()) if (f != null && f !== false) n.append(f instanceof Node ? f : String(f));
        return n;
      }

      async function rpc(nome, corpo) {
        const headers = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
        if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = `Bearer ${SUPABASE_KEY}`;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, { method: "POST", headers, body: JSON.stringify(corpo) });
        const dados = await res.json().catch(() => null);
        if (!res.ok) throw new Error(dados?.message || "erro");
        return dados;
      }

      function estado(titulo, texto) {
        $("conteudo").replaceChildren(el("div", { class: "estado" }, el("h1", { text: titulo }), el("p", { class: "lead", text: texto })));
        $("barra").style.width = "100%";
      }

      function pergunta(q, i) {
        const nome = `q-${q.id}`;
        const legenda = el("legend", {}, el("span", { class: "num", text: `${i + 1}.` }), q.texto, q.obrigatoria ? null : el("span", { class: "opc", text: " (opcional)" }));
        const fs = el("fieldset", { "data-id": q.id }, legenda);
        if (q.tipo === "likert" || q.tipo === "escala") {
          fs.append(el("div", { class: "escala escala--5" }, [1, 2, 3, 4, 5].map((n) => el("label", {}, el("input", { type: "radio", name: nome, value: n, "aria-label": q.tipo === "likert" ? `${n} — ${LIKERT[n - 1]}` : String(n) }), el("span", { text: String(n) })))));
          fs.append(el("div", { class: "pontas" }, el("span", { text: q.tipo === "likert" ? LIKERT[0] : q.minimo || "Muito baixo" }), el("span", { text: q.tipo === "likert" ? LIKERT[4] : q.maximo || "Muito alto" })));
        } else if (q.tipo === "nps") {
          fs.append(el("div", { class: "escala escala--11" }, Array.from({ length: 11 }, (_, n) => el("label", {}, el("input", { type: "radio", name: nome, value: n, "aria-label": String(n) }), el("span", { text: String(n) })))));
          fs.append(el("div", { class: "pontas" }, el("span", { text: "0 · Nada provável" }), el("span", { text: "10 · Muito provável" })));
        } else if (q.tipo === "escolha" || q.tipo === "multipla" || q.tipo === "simnao") {
          const opcoes = q.tipo === "simnao" ? [{ id: "sim", rotulo: "Sim" }, { id: "nao", rotulo: "Não" }] : q.opcoes;
          const tipo = q.tipo === "multipla" ? "checkbox" : "radio";
          fs.append(el("div", { class: "opcoes" }, opcoes.map((o) => el("label", {}, el("input", { type: tipo, name: nome, value: o.id }), el("span", { text: o.rotulo })))));
          if (q.maximo) fs.append(el("p", { class: "pontas", text: `Marque até ${q.maximo}.` }));
        } else {
          fs.append(el("textarea", { name: nome, maxlength: "3000", "aria-label": q.texto }));
        }
        return fs;
      }

      function valor(form, q) {
        const nome = `q-${q.id}`;
        if (q.tipo === "multipla") return [...form.querySelectorAll(`input[name="${nome}"]:checked`)].map((x) => x.value);
        if (q.tipo === "texto") return form.elements[nome].value.trim() || null;
        const marcado = form.querySelector(`input[name="${nome}"]:checked`);
        if (!marcado) return null;
        return ["likert", "escala", "nps"].includes(q.tipo) ? Number(marcado.value) : marcado.value;
      }

      function montar(p, token) {
        $("empresa").textContent = p.empresa || "Pesquisa";
        document.title = `${p.titulo} · ${p.empresa || "Pesquisa"}`;
        if (p.respondida) return estado("Entrevista já respondida", ERROS.ja_respondida);
        if (!p.aberta) return estado("Pesquisa encerrada", ERROS.pesquisa_encerrada);
        const offboarding = p.tipo === "offboarding";
        const perguntas = p.perguntas;
        const identificacao = !p.anonima && !offboarding;
        const form = el("form", { novalidate: true });
        const nome = el("input", { type: "text", id: "nome", autocomplete: "name", maxlength: "160" });
        const email = el("input", { type: "email", id: "email", autocomplete: "email", maxlength: "254" });
        const area = el("input", { type: "text", id: "area", maxlength: "80", placeholder: "Ex.: Comercial" });
        const erroGeral = el("p", { class: "msg-erro", role: "alert" });
        const enviar = el("button", { type: "submit", class: "enviar" }, "Enviar respostas");

        // append nativo escreveria "null": só nós de verdade.
        form.append(...[
          el("p", { class: "eyebrow", text: offboarding ? "Entrevista de desligamento" : "Pesquisa" }),
          el("h1", { text: offboarding && p.destinatario ? `${p.destinatario}, queremos ouvir você` : p.titulo }),
          p.descricao ? el("p", { class: "lead", text: p.descricao }) : null,
          el("div", { class: "aviso", text: p.anonima ? "Pesquisa anônima: não pedimos nome nem e-mail, e os resultados são vistos de forma agregada." : offboarding ? "Suas respostas são confidenciais e lidas apenas pelo RH." : "Pesquisa identificada: seu nome e e-mail ajudam o RH a dar retorno a você." }),
          identificacao ? el("fieldset", {}, el("legend", { text: "Identificação" }), el("div", { class: "grade" }, el("div", {}, el("label", { class: "campo", for: "nome", text: "Nome" }), nome), el("div", {}, el("label", { class: "campo", for: "email", text: "E-mail corporativo" }), email))) : null,
          !offboarding ? el("fieldset", {}, el("legend", {}, el("label", { for: "area", text: "Sua área" }), el("span", { class: "opc", text: " (opcional)" })), area) : null,
          ...perguntas.map(pergunta),
          erroGeral,
          enviar,
        ].filter(Boolean));

        const progresso = () => {
          const feitas = perguntas.filter((q) => { const v = valor(form, q); return Array.isArray(v) ? v.length : v != null; }).length;
          $("barra").style.width = `${Math.round((feitas / perguntas.length) * 100)}%`;
        };
        form.addEventListener("change", progresso);
        form.addEventListener("input", progresso);

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          erroGeral.textContent = "";
          const respostas = {};
          let primeiroErro = null;
          for (const q of perguntas) {
            const fs = form.querySelector(`fieldset[data-id="${q.id}"]`);
            fs.classList.remove("erro");
            fs.querySelector(".msg-erro")?.remove();
            const v = valor(form, q);
            const vazio = Array.isArray(v) ? !v.length : v == null;
            let msg = null;
            if (q.obrigatoria && vazio) msg = "Responda esta pergunta.";
            else if (q.maximo && Array.isArray(v) && v.length > q.maximo) msg = `Marque no máximo ${q.maximo}.`;
            if (msg) {
              fs.classList.add("erro");
              fs.append(el("p", { class: "msg-erro", text: msg }));
              primeiroErro ??= fs;
            } else if (!vazio) respostas[q.id] = v;
          }
          if (identificacao && email.value && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)) {
            primeiroErro ??= email;
            erroGeral.textContent = "Confira o e-mail informado.";
          }
          if (primeiroErro) {
            erroGeral.textContent ||= "Há perguntas obrigatórias sem resposta.";
            primeiroErro.scrollIntoView({ behavior: "smooth", block: "center" });
            primeiroErro.querySelector?.("input, textarea")?.focus({ preventScroll: true });
            return;
          }
          enviar.disabled = true;
          enviar.textContent = "Enviando…";
          try {
            await rpc("bp_responder_pesquisa", { p_token: token, p_respostas: respostas, p_nome: identificacao ? nome.value : null, p_email: identificacao ? email.value : null, p_area: offboarding ? null : area.value });
            estado("Obrigado!", offboarding ? "Sua entrevista foi registrada. Desejamos sucesso no seu próximo passo." : "Suas respostas foram registradas. Elas ajudam a construir um lugar melhor para trabalhar.");
            window.scrollTo(0, 0);
          } catch (err) {
            erroGeral.textContent = ERROS[err.message] || "Não foi possível enviar agora. Verifique sua conexão e tente de novo.";
            enviar.disabled = false;
            enviar.textContent = "Enviar respostas";
          }
        });
        $("conteudo").replaceChildren(form, el("p", { class: "rodape", text: "Pesquisa conduzida com Candydate." }));
      }

      (async () => {
        const token = new URLSearchParams(location.search).get("t") || "";
        if (!/^[0-9a-f]{64}$/.test(token)) return estado("Link inválido", ERROS.link_invalido);
        try {
          const p = await rpc("bp_pesquisa_publica", { p_token: token });
          if (!p) return estado("Link inválido", ERROS.link_invalido);
          montar(p, token);
        } catch {
          estado("Não foi possível abrir", "Verifique sua conexão e recarregue a página.");
        }
      })();
    </script>
  </body>
</html>
